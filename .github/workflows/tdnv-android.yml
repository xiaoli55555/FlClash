name: Build tdnv Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - assets/images/tdnv.png
      - tool/generate_tdnv_icons.py
      - lib/**
      - android/**
      - arb/**
      - pubspec.yaml
      - distribute_options.yaml
      - test/common/request_test.dart
      - test/android_branding_test.dart
      - .github/workflows/tdnv-android.yml

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Generate tdnv app icons
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/tdnv-icon-tools"
          "$RUNNER_TEMP/tdnv-icon-tools/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/tdnv-icon-tools/bin/python" tool/generate_tdnv_icons.py
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'cmdline-tools;latest'
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --version
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Fetch CA certificates
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" https://curl.se/ca/cacert-2026-09-25.pem
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
      - name: Configure required fixed signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::Fixed signing is required. Configure KEYSTORE, KEY_ALIAS, STORE_PASSWORD and KEY_PASSWORD repository secrets.'
            exit 1
          fi
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          echo 'fee82cf12f5986fa4585cc93e36d6a4faf9912b6068d56ef8e742dce6c2c702c  android/app/keystore.jks' | sha256sum -c -
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace(' ', '\\ ')
          values = {'keyAlias': os.environ['KEY_ALIAS'], 'storePassword': os.environ['STORE_PASSWORD'], 'keyPassword': os.environ['KEY_PASSWORD']}
          with Path('android/local.properties').open('a') as output:
              output.write('\n')
              for key, value in values.items():
                  output.write(f'{key}={escape(value)}\n')
          PYTHON
          keytool -list -keystore android/app/keystore.jks -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localized tdnv text
        run: dart run intl_utils:generate
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Verify localization
        run: flutter test test/l10n test/lint/dynamic_message_key_test.dart test/android_branding_test.dart
      - name: Build arm64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --arch arm64 --env stable -v
      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/tdnv-certificate.txt"
            certificate=$(awk '/certificate SHA-256 digest:/ {print tolower($NF)}' "$RUNNER_TEMP/tdnv-certificate.txt" | sort -u)
            test "$certificate" = 'c815dd5d5d67b4aad58e0eeb1c508dbf3a8ca3939d0a0512bfcbb1568b508456'
            target="${apk/FlClash-/tdnv-}"
            if [ "$target" != "$apk" ]; then
              mv "$apk" "$target"
            fi
          done
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tdnv-android-arm64-signed
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
